<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #141311; }
a { color: #EFE7D6; } a:hover { color: #ffffff; }
</style>
</helmet>

<div style="min-height: 100vh; background: #141311; color: #EFE7D6; font-family: 'Space Grotesk', Helvetica, sans-serif; padding: 64px 40px 96px; box-sizing: border-box; display: flex; flex-direction: column; gap: 72px; align-items: center;">

  <div style="display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55;">BugJam — identity mark</div>
    <div style="font-size: 15px; opacity: 0.6; max-width: 46ch; line-height: 1.6;">One abstract mark: a round body with two antenna dots. Built from circles only, so it holds at 16px.</div>
  </div>

  <!-- primary: cream on dark -->
  <div style="width: 100%; max-width: 760px; border: 1px solid rgba(239,231,214,0.14); border-radius: 6px; padding: 72px 40px; display: flex; justify-content: center;">
    <div style="position: relative; width: 200px; height: 200px;">
      <div style="position: absolute; left: 36px; top: 0; width: 26px; height: 26px; border-radius: 50%; background: #EFE7D6;"></div>
      <div style="position: absolute; right: 36px; top: 0; width: 26px; height: 26px; border-radius: 50%; background: #EFE7D6;"></div>
      <div style="position: absolute; left: 0; bottom: 0; width: 200px; height: 156px; border-radius: 78px / 84px; background: #EFE7D6;"></div>
      <div style="position: absolute; left: 96px; bottom: 26px; width: 8px; height: 104px; background: #141311; border-radius: 4px;"></div>
    </div>
  </div>

  <!-- reversed: dark on cream -->
  <div style="width: 100%; max-width: 760px; background: #EFE7D6; border-radius: 6px; padding: 72px 40px; display: flex; justify-content: center;">
    <div style="position: relative; width: 200px; height: 200px;">
      <div style="position: absolute; left: 36px; top: 0; width: 26px; height: 26px; border-radius: 50%; background: #141311;"></div>
      <div style="position: absolute; right: 36px; top: 0; width: 26px; height: 26px; border-radius: 50%; background: #141311;"></div>
      <div style="position: absolute; left: 0; bottom: 0; width: 200px; height: 156px; border-radius: 78px / 84px; background: #141311;"></div>
      <div style="position: absolute; left: 96px; bottom: 26px; width: 8px; height: 104px; background: #EFE7D6; border-radius: 4px;"></div>
    </div>
  </div>

  <!-- sizes -->
  <div style="width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 24px;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55;">Favicon sizes</div>
    <div style="display: flex; gap: 40px; align-items: flex-end; flex-wrap: wrap;">

      <div style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
        <div style="position: relative; width: 64px; height: 64px;">
          <div style="position: absolute; left: 11.5px; top: 0; width: 8.3px; height: 8.3px; border-radius: 50%; background: #EFE7D6;"></div>
          <div style="position: absolute; right: 11.5px; top: 0; width: 8.3px; height: 8.3px; border-radius: 50%; background: #EFE7D6;"></div>
          <div style="position: absolute; left: 0; bottom: 0; width: 64px; height: 50px; border-radius: 25px / 27px; background: #EFE7D6;"></div>
          <div style="position: absolute; left: 30.7px; bottom: 8px; width: 2.6px; height: 33px; background: #141311; border-radius: 2px;"></div>
        </div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; opacity: 0.5;">64</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
        <div style="position: relative; width: 32px; height: 32px;">
          <div style="position: absolute; left: 5.7px; top: 0; width: 4.2px; height: 4.2px; border-radius: 50%; background: #EFE7D6;"></div>
          <div style="position: absolute; right: 5.7px; top: 0; width: 4.2px; height: 4.2px; border-radius: 50%; background: #EFE7D6;"></div>
          <div style="position: absolute; left: 0; bottom: 0; width: 32px; height: 25px; border-radius: 12.5px / 13.5px; background: #EFE7D6;"></div>
          <div style="position: absolute; left: 15.3px; bottom: 4px; width: 1.4px; height: 17px; background: #141311; border-radius: 1px;"></div>
        </div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; opacity: 0.5;">32</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
        <div style="position: relative; width: 16px; height: 16px;">
          <div style="position: absolute; left: 2.9px; top: 0; width: 2.4px; height: 2.4px; border-radius: 50%; background: #EFE7D6;"></div>
          <div style="position: absolute; right: 2.9px; top: 0; width: 2.4px; height: 2.4px; border-radius: 50%; background: #EFE7D6;"></div>
          <div style="position: absolute; left: 0; bottom: 0; width: 16px; height: 12.5px; border-radius: 6.2px / 6.8px; background: #EFE7D6;"></div>
          <div style="position: absolute; left: 7.5px; bottom: 2px; width: 1px; height: 8.5px; background: #141311; border-radius: 1px;"></div>
        </div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; opacity: 0.5;">16</div>
      </div>

    </div>
  </div>

  <!-- in context -->
  <div style="width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 24px;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55;">In a nav bar</div>
    <div style="border: 1px solid rgba(239,231,214,0.14); border-radius: 6px; padding: 18px 24px; display: flex; align-items: center; gap: 14px;">
      <div style="position: relative; width: 28px; height: 28px; flex: none;">
        <div style="position: absolute; left: 5px; top: 0; width: 3.7px; height: 3.7px; border-radius: 50%; background: #EFE7D6;"></div>
        <div style="position: absolute; right: 5px; top: 0; width: 3.7px; height: 3.7px; border-radius: 50%; background: #EFE7D6;"></div>
        <div style="position: absolute; left: 0; bottom: 0; width: 28px; height: 22px; border-radius: 11px / 12px; background: #EFE7D6;"></div>
        <div style="position: absolute; left: 13.4px; bottom: 3.5px; width: 1.2px; height: 15px; background: #141311; border-radius: 1px;"></div>
      </div>
      <div style="font-size: 19px; font-weight: 500; letter-spacing: -0.01em;">BugJam</div>
      <div style="margin-left: auto; display: flex; gap: 22px; font-size: 14px; opacity: 0.5;">
        <span>Issues</span><span>Boards</span><span>Reports</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}"></script>
</body>
</html>
